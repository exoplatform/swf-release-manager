##
#  Release Manager Informations
##

## GitHub
github_login=
github_fullname=
github_email=
github_ssh_passphrase=

## Nexus - Maven
nexus_login=
nexus_token=
gpg_passphrase=

## JIRA
jira_auth_header=

##
#  Infrastructure Informations
##

## Git
GIT_HOST=github.com

## Nexus eXo (Nexus Repository 3 Pro with staging)
# The Nexus URL is fixed in the scripts (https://repository2.exoplatform.org)
# Maven server id (settings.xml) used by the nxrm3 plugin
NEXUS_STAGING_SERVER_ID=exo.staging
# Staging repository and release repository (destination of the move) per catalog nexus_staging_profile
NEXUS_STAGING_REPO_PUBLIC=
NEXUS_RELEASE_REPO_PUBLIC=
NEXUS_STAGING_REPO_@@@@_TRIAL=
NEXUS_RELEASE_REPO_@@@@_TRIAL=
# nxrm3-maven-plugin version (optional)
#NXRM3_PLUGIN_VERSION=1.0.13

## JIRA
JIRA_API_URL=https://jira.exoplatform.org/rest/api/2/
JIRA_WEBHOOK_URL=https://jira.exoplatform.org/rest/webhooks/1.0/webhook

## CATALOG
CATALOG_BASE_URL=https://raw.githubusercontent.com/exoplatform/swf-scripts/master/release-process/datas/catalog

## Tribe
TRIBE_RELEASE_TASK_REST_PREFIXE_URL=https://community.exoplatform.com/rest/private/tasks/comments
TRIBE_RELEASE_USER=
TRIBE_RELEASE_PASSWORD=
